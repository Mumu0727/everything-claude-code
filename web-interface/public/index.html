<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTCC Web Interface - Claude Code插件可视化界面</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.staticfile.org/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.staticfile.org/bootstrap-icons/1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <i class="bi bi-code-square me-2 fs-4"></i>
                <span class="fw-bold">JTCC Web Interface</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto" role="menubar">
                    <li class="nav-item" role="none">
                        <a class="nav-link active" href="#" data-section="commands" role="menuitem" aria-current="page">
                            <i class="bi bi-terminal me-1" aria-hidden="true"></i>命令
                        </a>
                    </li>
                    <li class="nav-item" role="none">
                        <a class="nav-link" href="#" data-section="agents" role="menuitem">
                            <i class="bi bi-robot me-1" aria-hidden="true"></i>代理
                        </a>
                    </li>
                    <li class="nav-item" role="none">
                        <a class="nav-link" href="#" data-section="skills" role="menuitem">
                            <i class="bi bi-gear me-1" aria-hidden="true"></i>技能
                        </a>
                    </li>
                </ul>

                <div class="d-flex align-items-center">
                    <!-- 搜索框 -->
                    <div class="position-relative me-3">
                        <input type="text" id="globalSearch" class="form-control form-control-sm"
                               placeholder="搜索命令、代理、技能..." style="width: 250px;"
                               aria-label="全局搜索" role="searchbox" aria-describedby="search-help">
                        <i class="bi bi-search position-absolute top-50 end-0 translate-middle-y me-2 text-muted" aria-hidden="true"></i>
                        <span id="search-help" class="visually-hidden">使用 Ctrl+K 快速聚焦搜索框</span>
                    </div>

                    <!-- 主题切换 -->
                    <button id="themeToggle" class="btn btn-outline-light btn-sm me-2"
                            aria-label="切换主题" title="切换到深色主题">
                        <i class="bi bi-moon-fill" aria-hidden="true"></i>
                    </button>

                    <!-- GitHub链接 -->
                    <a href="https://github.com/Mumu0727/everything-claude-code"
                       target="_blank" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-github"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container-fluid mt-4">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-lg-3 col-md-4 mb-4">
                <div class="card sidebar-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0">
                            <i class="bi bi-funnel me-1"></i>筛选器
                        </h6>
                        <button id="clearFilters" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-x-circle me-1"></i>清除
                        </button>
                    </div>
                    <div class="card-body">
                        <!-- 类型筛选 -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">命令类型</label>
                            <div id="typeFilters" class="filter-group">
                                <!-- 动态生成类型选项 -->
                            </div>
                        </div>

                        <!-- 统计信息 -->
                        <div class="stats-section">
                            <h6 class="fw-semibold mb-2">
                                <i class="bi bi-graph-up me-1"></i>统计信息
                            </h6>
                            <div id="statsContainer">
                                <!-- 动态生成统计信息 -->
                            </div>
                        </div>
                        <!-- 最近更新 -->
                        <div class="card mt-3">
                            <div class="card-header">
                                <h6 class="mb-0">
                                    <i class="bi bi-clock-history me-1"></i>最近更新
                                </h6>
                            </div>
                            <div class="card-body">
                                <div id="recentUpdates">
                                    <!-- 动态生成最近更新列表 -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 主内容区 -->
            <div class="col-lg-9 col-md-8">
                <!-- 加载状态 -->
                <div id="loadingSpinner" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <div class="mt-2 text-muted">正在加载数据...</div>
                </div>

                <!-- 内容容器 -->
                <div id="contentContainer" style="display: none;">
                    <!-- 页面标题和搜索结果信息 -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 id="sectionTitle">
                                <i class="bi bi-terminal me-2"></i>命令列表
                            </h2>
                            <p id="sectionDescription" class="text-muted mb-0">
                                浏览所有可用的Claude Code命令，点击查看详细信息和用法示例
                            </p>
                        </div>
                        <div id="resultInfo" class="text-muted">
                            <!-- 显示搜索结果数量和筛选信息 -->
                        </div>
                    </div>

                    <!-- 内容列表 -->
                    <div id="contentList">
                        <!-- 动态生成内容列表 -->
                    </div>

                    <!-- 分页 -->
                    <nav id="pagination" class="mt-4" style="display: none;">
                        <ul class="pagination justify-content-center">
                            <!-- 动态生成分页 -->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- 详情模态框 -->
    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title d-flex align-items-center">
                        <i id="modalIcon" class="bi bi-terminal me-2"></i>
                        <span id="modalTitle">命令详情</span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="modalContent">
                        <!-- 动态生成详情内容 -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" id="copyCommand" class="btn btn-primary">
                        <i class="bi bi-clipboard me-1"></i>复制命令
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast通知 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <i class="bi bi-info-circle text-primary me-2"></i>
                <strong class="me-auto">提示</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage">
                <!-- 动态生成消息内容 -->
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.staticfile.org/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <!-- 应用脚本 -->
    <script src="/js/utils/api.js"></script>
    <script src="/js/components/command-list.js"></script>
    <script src="/js/components/search-bar.js"></script>
    <script src="/js/components/command-detail.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
